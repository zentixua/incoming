<!-- Bus D-Bus nested KWin (it is raised by dbus-run-session into tools/nested_kwin.sh). Like session.conf itself dbus,
     but without service catalogs (standard_session_servicedirs), that is, without D-Bus activation: the bus does not start services
     on the first call, there are only processes of the session itself (KWin, Xwayland, client); calling a name without an owner
     gets an error org.freedesktop.DBus.Error.ServiceUnknown.

     Why: XDG_RUNTIME_DIR the nested session is shared with the desktop, and the desktop service is launched by this bus,
     manages it as if it were his own. With activation, the call bus from the session raises xdg-desktop-portal, it —
     xdg-document-portal, and at startup he removes the host mount $XDG_RUNTIME_DIR/doc (fusermount3 -u -z: FUSE in place
     he considers what remains of his former self), upon leaving - his own; flatpak host applications do not start after this
     («bwrap: Can't find source path /run/user/1000/doc/by-app/…»). -->
<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-Bus Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>
  <type>session</type>
  <keep_umask/>
  <listen>unix:tmpdir=/tmp</listen>
  <auth>EXTERNAL</auth>
  <policy context="default">
    <allow send_destination="*" eavesdrop="true"/>
    <allow eavesdrop="true"/>
    <allow own="*"/>
  </policy>
</busconfig>
