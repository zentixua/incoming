// Scene bench (README.md): client mod without Incoming dependency; identical bench captures any Incoming
// 3.4.1+ jar (release or branch). Build/unit tests: mod/gradlew -p tools/stand build
plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.147'
}

group = 'ua.zentix.stand'
base { archivesName = 'stand' }

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

repositories {
    mavenCentral()
}

neoForge {
    version = project.neo_version
    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }
    runs {
        // Bench client: game directory -PrunDir (stand.py prepares mods/, shaderpacks/, config/, options.txt and
        // stand-plan.json), window -Pwidth × -Pheight (default 2560×1600, like Artem's laptop)
        client {
            client()
            gameDirectory = project.file(project.findProperty('runDir') ?: 'run')
            programArguments.addAll '--width', (project.findProperty('width') ?: '2560').toString(),
                    '--height', (project.findProperty('height') ?: '1600').toString()
            jvmArgument "-Xmx${project.findProperty('xmx') ?: '6g'}"
        }
        configureEach {
            logLevel = org.slf4j.event.Level.INFO
        }
    }
    mods {
        stand {
            sourceSet(sourceSets.main)
        }
    }
}
neoForge.addModdingDependenciesTo(sourceSets.test)

// Client without live Gradle (like mod rigLaunch, mod/build.gradle): mod/gradlew -p tools/stand standLaunch -PrunDir=…
// writes build/launch/client.sh (same Java, arguments, classpath, directory and environment as runClient). Gradle exits
// before measurement: no daemon CPU/memory beside client, no lock UDP socket (0.0.0.0) beside the game.
tasks.register('standLaunch') {
    dependsOn { tasks.named('runClient').get().taskDependencies }
    doLast {
        def run = tasks.named('runClient').get()
        File dir = layout.buildDirectory.dir('launch').get().asFile
        dir.mkdirs()
        // Copy the MDG @file: next preparation overwrites it
        def own = { String arg ->
            if (!arg.startsWith('@')) return arg
            File src = file(arg.substring(1))
            File copy = new File(dir, "client-${src.name}")
            copy.bytes = src.bytes
            return '@' + copy.absolutePath
        }
        List<String> cmd = [run.javaLauncher.get().executablePath.asFile.absolutePath]
        // JavaExec allJvmArgs omits explicit task jvmArgs, including the MDG @file (modules, --add-opens, launch -D)
        cmd += ((run.jvmArgs ?: []) + run.allJvmArgs.findAll { !(it in (run.jvmArgs ?: [])) }).collect(own)
        cmd += ['-cp', run.classpathProvider.asPath, run.mainClass.get()]
        cmd += (run.args + run.argumentProviders.collectMany { it.asArguments() as List }).collect(own)
        def quote = { String v -> "'" + v.replace("'", "'\\''") + "'" }
        File gameDir = run.gameDirectory.get().asFile
        File script = new File(dir, 'client.sh')
        script.text = "#!/usr/bin/env bash\n# Bench runClient without Gradle: generated by mod/gradlew -p tools/stand standLaunch (build.gradle)\n" +
                "mkdir -p ${quote(gameDir.absolutePath)}/logs && cd ${quote(gameDir.absolutePath)} || exit 1\n" +
                "exec env ${run.environmentProperty.get().collect { k, v -> quote("${k}=${v}") }.join(' ')} ${cmd.collect(quote).join(' ')}\n"
        script.setExecutable(true)
        println "standLaunch: ${script} (game directory ${gameDir})"
    }
}

dependencies {
    testImplementation platform('org.junit:junit-bom:5.10.2')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.compilerArgs += ['-Xlint:all,-processing,-serial,-classfile,-this-escape', '-Xmaxerrs', '1000']
}
