// Analyze Flashback replays into tables (README.md): client mod without an Incoming dependency; an old game replay
// is viewed with that day's Incoming jar. Build and unit tests: mod/gradlew -p tools/replayscan build
plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.147'
}

group = 'ua.zentix.replayscan'
base { archivesName = 'replayscan' }

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

repositories {
    // Distant Horizons API (DH has no Maven repository; Modrinth serves project files through Maven)
    exclusiveContent {
        forRepository { maven { url = 'https://api.modrinth.com/maven' } }
        filter { includeGroup 'maven.modrinth' }
    }
    mavenCentral()
}

// Runtime mods (-PmodsDir=<directory>): all jars there go to run/mods. Requires Flashback 0.39, Flashback NeoForge Fixed,
// Sinytra Connector, Forgified Fabric API and recording mods (that day's Incoming, Create, Sable, Aeronautics…)
def modsDir = project.findProperty('modsDir')

neoForge {
    version = project.neo_version
    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }
    runs {
        // windowless client (xvfb-run): opens a replay, plays it (or films the -Pfilm plan), then exits; properties:
        // -P<name> → replayscan.<name>
        client {
            client()
            gameDirectory = project.file(project.findProperty('runDir') ?: 'run')
            ['replay', 'out', 'speed', 'viewers', 'every', 'range', 'subjects', 'ask', 'from', 'to', 'film'].each { key ->
                def value = project.findProperty(key)
                if (value == null) return
                // paths relative to the Gradle invocation directory (game runs in its own run directory)
                if (key in ['replay', 'out', 'ask', 'film']) {
                    def f = new File(value.toString())
                    value = (f.absolute ? f : new File(gradle.startParameter.currentDir, value.toString())).absolutePath
                }
                systemProperty "replayscan.${key}", value.toString()
            }
            // Connector needs a clean client jar in launcher layout (NeoForge installer: libraries/net/minecraft/client/…-srg.jar)
            def clean = project.findProperty('connectorClean') ?: System.getenv('CONNECTOR_CLEAN')
            if (clean) systemProperty 'connector.clean.path', clean.toString()
            programArguments.addAll '--width', '640', '--height', '360'
            // client memory (-Pxmx): replay world with full modpack and long recording exceeds 6 GB
            jvmArgument "-Xmx${project.findProperty('xmx') ?: '6g'}"
        }
        configureEach {
            logLevel = org.slf4j.event.Level.INFO
        }
    }
    mods {
        replayscan {
            sourceSet(sourceSets.main)
        }
    }
}
neoForge.addModdingDependenciesTo(sourceSets.test)

tasks.register('copyRunMods', Sync) {
    from(modsDir ?: 'no-mods-dir') { include '*.jar' }
    into({ "${project.findProperty('runDir') ?: 'run'}/mods" })
    onlyIf { modsDir != null }
}
tasks.matching { it.name == 'runClient' }.configureEach { dependsOn 'copyRunMods' }

dependencies {
    // Distant Horizons: compile-only API for LOD depth checks in captured frames when DH is installed (film/DhDepth)
    compileOnly "maven.modrinth:distanthorizonsapi:${dh_api_version}"
    testImplementation platform('org.junit:junit-bom:5.10.2')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.compilerArgs += ['-Xlint:all,-processing,-serial,-classfile,-this-escape', '-Xmaxerrs', '1000']
}
