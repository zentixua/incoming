org.gradle.jvmargs=-Xmx3G
# no daemon by default: game launched by a run* task through a daemon would live in the daemon cgroup (often the Claude app), not the
# tools/laptop_job.sh service; for edits and tests use ./gradlew --daemon (CLAUDE.md, "Work cycle"); daemon stops after 10 min
# idle
org.gradle.daemon=false
org.gradle.daemon.idletimeout=600000
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=false

# Versions as in Open Skies modpack (zentixua/open-skies-friends: pack/pack.toml, pack/mods): MC 1.21.1, NeoForge, Sable
minecraft_version=1.21.1
minecraft_version_range=[1.21.1]
neo_version=21.1.264
loader_version_range=[4,)
parchment_minecraft_version=1.21.1
parchment_mappings_version=2024.11.17

sable_version=2.0.6
sable_companion_version=1.6.0
# API Distant Horizons 3.3.3 (DhApi.getApiMajorVersion() == 7)
dh_api_version=7.2.0
# Distant Horizons (optional): API 7, tested on 3.3.3; NeoForge refuses to load DH older than 3.3 with the mod
dh_version_range=[3.3,)
# LOD Server Support 0.19.0 for NeoForge 1.21.1 (Modrinth version number): compile only, API LSSApi.registerColumnConsumer
lss_version=ydDRzPcM
# Mekanism (optional, MIT): compile-only API, item capability mekanism:radiation_shielding (compat/mekanism)
mekanism_version=10.7.19.85
# Jade 15.10.6 for NeoForge 1.21.1 (optional, CC BY-NC-SA 4.0; Modrinth version): compile only, compat/jade
jade_version=15.10.6+neoforge
# CC:Tweaked API (optional, MPL-2.0): compile only, compat/computercraft; 1.113.0 is the first 1.21.1 release, so nothing
# newer than every supported runtime is used
cctweaked_version=1.113.0
# Create (compile only: compat/create Display Link sources); the pack's version, also tools/fetch_runtime_mods.py
create_version=6.0.10+mc1.21.1
# Ponder, the version Create 6.0.10 carries (GameTest compile only: Create block entities name its type)
ponder_version=1.0.82+mc1.21.1
# FTB Teams (optional): compile only, compat/ftbteams; 2101.1.0 is its first 1.21.1 build and has every API call used
ftbteams_version=2101.1.0
# FTB Library (FTB Teams' required dependency): unit-test runtime only, the type its Team interface names
ftblibrary_version=2101.1.0
# Architectury (FTB Teams' required dependency): compile only, the type of FTB Teams' events; FTB Teams 2101.1.0 needs 13.0.1+
architectury_version=13.0.1
# Open Parties and Claims 0.23.4 for NeoForge 1.21.1 (optional, LGPL-3.0; Modrinth version ID, its first 1.21.1 NeoForge
# build): compile only, compat/opac
opac_version=hykq6AKT

mod_id=incoming
mod_name=Incoming
mod_license=GPL-3.0-only
mod_version=3.14.0
mod_group_id=ua.zentix.incoming
mod_authors=ZentixUA
mod_url=https://github.com/zentixua/incoming
# gradle.properties is read as ISO-8859-1: non-ASCII only as \uXXXX; description in English (mod list, Modrinth)
mod_description=Air strikes for Minecraft 1.21.1: Shahed-136 kamikaze drones, Lancet loitering munitions, cruise missiles, Grad rocket salvos, a B-2 with a bunker buster and an ICBM with a nuclear warhead, and a surface-to-air missile system that shoots down drones, cruise missiles and bombers. Aim the Strike Designator at blocks, mobs, players or Create Aeronautics aircraft, or pick a spot on the targeting map.
