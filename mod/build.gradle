plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.147'
}

version = mod_version
group = mod_group_id

base { archivesName = mod_id }

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

// Checks only for runs from Gradle (GameTest, client scenario): they do not get into the mod's jar
sourceSets {
    devtest {
        compileClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.main.output
    }
    // hot-swap agent of the effects sandbox (tools/sandbox.sh): its own jar for -javaagent, without Minecraft, not part
    // of the mod
    sandboxAgent {}
    // unit tests of the pure parts of the checks (parsing the commands scenario — CommandPlanTest, sandbox commands,
    // agent)
    test {
        compileClasspath += sourceSets.devtest.output + sourceSets.sandboxAgent.output
        runtimeClasspath += sourceSets.devtest.output + sourceSets.sandboxAgent.output
    }
}
configurations {
    devtestCompileOnly.extendsFrom compileOnly
    devtestImplementation.extendsFrom implementation
    // effects sandbox mods (copyRuntimeMods_scenario with INCOMING_SANDBOX)
    sandboxMods { transitive = false }
}

repositories {
    exclusiveContent {
        forRepository { maven { url = 'https://maven.ryanhcode.dev/releases' } }
        filter { includeGroupAndSubgroups 'dev.ryanhcode' }
    }
    // Distant Horizons API (DH has no maven of its own; Modrinth serves the project files as maven)
    exclusiveContent {
        forRepository { maven { url = 'https://api.modrinth.com/maven' } }
        filter { includeGroup 'maven.modrinth' }
    }
    // glsl-processor — parsing of Veil's GLSL (carried by Sable): ShaderSourceTest runs its shaders through it
    exclusiveContent {
        forRepository { maven { url = 'https://maven.blamejared.com' } }
        filter { includeModule 'io.github.ocelot', 'glsl-processor' }
    }
    mavenCentral()
}

// Mods from the host's instance (the «Open Skies» pack) for runs from Gradle (Create, Sable, Aeronautics).
// NeoForge 1.21.1 works on mojmap names, so jars from mods/ fit without remapping.
// Directory — -PmcModsDir=..., otherwise from tools/paths.py (the only place for game paths; MC_DIR overrides it):
// a separate copy of the path here survived the instance rename and silently pointed at nothing.
def mcModsDir = file(project.findProperty('mcModsDir')
        ?: providers.exec { commandLine 'python3', file('../tools/paths.py').path, 'MODS' }.standardOutput.asText.get().trim())
def runtimeModPatterns = ['create-1.21.1-*.jar', 'sable-neoforge-1.21.1-*.jar', 'create-aeronautics-bundled-1.21.1-*.jar']
// client scenario with Sodium and Iris, as on the host (tools/client_scenario.sh nuke shaders)
def shaderModPatterns = System.getenv('INCOMING_SHADERS') ? ['sodium-neoforge-*.jar', 'iris-neoforge-*.jar'] : []
// ... and with Distant Horizons, as on the host: the far terrain of the aiming map (tools/client_scenario.sh target-map
// dh)
def dhModPatterns = System.getenv('INCOMING_DH') ? ['DistantHorizons-*.jar'] : []
// ... or with Voxy via Roxy (Voxy's official jar for 1.21.11, Roxy adapts it to 1.21.1; needs Sodium and Forgified
// Fabric API): Voxy's terrain depth for the effects layer (tools/client_scenario.sh far voxy)
def voxyModPatterns = System.getenv('INCOMING_VOXY') ? ['sodium-neoforge-*.jar', 'roxy-*.jar', 'voxy-*.jar', 'forgified-fabric-api-*.jar'] : []
// ... and with LOD Server Support: the far map terrain from the server (tools/client_scenario.sh target-map lss;
// the script puts the jar in place — the host's build does not have it yet)
def lssModPatterns = System.getenv('INCOMING_LSS') ? ['lod-server-support-neoforge-*.jar'] : []
// GameTest with Lithium, as on the host (-PwithLithium): a manual compatibility check, none in CI
def lithiumModPatterns = project.hasProperty('withLithium') ? ['lithium-neoforge-*.jar'] : []

// the client directory of the scenario; in multiplayer each client has its own (tools/mp_scenario.sh) effects sandbox
// (tools/sandbox.sh): the sandbox scenario in its own directory, only the mod (+ Iris and DH if wanted) and the
// hot-swap agent that watches the mod's class directories
def sandbox = System.getenv('INCOMING_SANDBOX') != null
def scenarioDir = project.findProperty('scenarioDir') ?: (sandbox ? 'run/sandbox' : 'run/scenario')

neoForge {
    version = project.neo_version
    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }
    runs {
        client {
            client()
            gameDirectory = project.file('run/client')
        }
        // client without a window for the check scenario (see src/devtest/.../ClientScenario and
        // tools/client_scenario.sh)
        clientScenario {
            client()
            // multiplayer (tools/mp_scenario.sh): each client has its own directory and nickname
            gameDirectory = project.file(scenarioDir)
            if (project.findProperty('scenarioUser')) programArguments.addAll '--username', project.findProperty('scenarioUser')
            if (System.getenv('INCOMING_MP_PORT')) systemProperty 'incoming.mp.port', System.getenv('INCOMING_MP_PORT')
            // scenario mode (all, launch, nuke, fx, models…) — the list is in tools/client_scenario.sh
            systemProperty 'incoming.scenario', System.getenv('INCOMING_SCENARIO') ?: 'all'
            // strike profile in the cloud without prod_client.py: steps and interval — as --prop
            // incoming.profile.steps/gap
            if (System.getenv('INCOMING_PROFILE_STEPS')) systemProperty 'incoming.profile.steps', System.getenv('INCOMING_PROFILE_STEPS')
            if (System.getenv('INCOMING_PROFILE_GAP')) systemProperty 'incoming.profile.gap', System.getenv('INCOMING_PROFILE_GAP')
            // commands scenario in the cloud without prod_client.py: steps separated by “;”, as --prop
            // incoming.commands
            if (System.getenv('INCOMING_COMMANDS')) systemProperty 'incoming.commands', System.getenv('INCOMING_COMMANDS')
            // client fire measurement in a detailed city: INCOMING_CITY=N@tick (FireCity — N sections with a global
            // palette in the chunk)
            if (System.getenv('INCOMING_CITY')) systemProperty 'incoming.scenario.city', System.getenv('INCOMING_CITY')
            // open the scenario world of the previous run instead of creating it anew
            // (INCOMING_WORLD=incoming_scenario: re-entry, e.g. LSS terrain from a file, when LSS sends only what
            // changed)
            if (System.getenv('INCOMING_WORLD')) systemProperty 'incoming.world', System.getenv('INCOMING_WORLD')
            // probe scenario (gate): only these scenes (INCOMING_PROBE_CASES=flyby,grad-day — as --prop
            // incoming.probe.cases)
            if (System.getenv('INCOMING_PROBE_CASES')) systemProperty 'incoming.probe.cases', System.getenv('INCOMING_PROBE_CASES')
            // guide scenario: only these sections (INCOMING_GUIDE=recipes,map — the list is in GuideShots)
            if (System.getenv('INCOMING_GUIDE')) systemProperty 'incoming.guide', System.getenv('INCOMING_GUIDE')
            // window size: INCOMING_SIZE=1920x1080 (trailer), by default 1280x720
            def size = (System.getenv('INCOMING_SIZE') ?: '1280x720').split('x')
            programArguments.addAll '--width', size[0], '--height', size[1]
            // the trailer checks that the frame is exactly that (otherwise the KWin window shrinks by its title bar)
            systemProperty 'incoming.frame', size.join('x')
            environment 'ALSOFT_CONF', project.file(sandbox ? "${scenarioDir}/alsoft.conf" : 'run/scenario/alsoft.conf').absolutePath
            if (sandbox) {
                def classes = [sourceSets.main, sourceSets.devtest].collect { it.java.destinationDirectory.get().asFile.absolutePath }
                jvmArgument "-javaagent:${project.file('build/sandbox/sandbox-agent.jar').absolutePath}=" +
                        ([project.file("${scenarioDir}/fx/hotswap").absolutePath] + classes).join(';')
                // JetBrains Runtime (INCOMING_SANDBOX_JAVA; the flag is known to it — tools/sandbox.sh checks it): hot
                // swap accepts new fields, methods and lambdas too; a plain JVM does not start with this flag
                if (System.getenv('INCOMING_SANDBOX_ENHANCED')) jvmArgument '-XX:+AllowEnhancedClassRedefinition'
            }
            // LSS serves LOD also through the built-in server of singleplayer — with its own test property (otherwise
            // only over the network)
            if (System.getenv('INCOMING_LSS')) systemProperty 'lss.test.integratedServer', 'true'
            // effects-layer GPU time per pass and part (drain frames, LayerTimes): INCOMING_FX_DRAIN=1 tools/sandbox.sh
            // start
            if (System.getenv('INCOMING_FX_DRAIN')) systemProperty 'incoming.fx.drain', 'true'
            // garbage collector pauses — to tell them apart from slow code (run/scenario/logs/gc.log)
            jvmArgument "-Xlog:gc:file=${project.file("${scenarioDir}/logs/gc.log").absolutePath}:time,uptime"
            // optional JFR profile: INCOMING_JFR=1 tools/client_scenario.sh nuke → run/scenario/logs/scenario.jfr
            if (System.getenv('INCOMING_JFR')) jvmArgument "-XX:StartFlightRecording=filename=${project.file('run/scenario/logs/scenario.jfr').absolutePath},settings=profile"
        }
        server {
            server()
            gameDirectory = project.file(project.findProperty('serverDir') ?: 'run/server')
            programArgument '--nogui'
        }
        // load stand (tools/stress.sh): dedicated server with the director and player clients, see
        // src/devtest/.../stress
        stressServer {
            server()
            gameDirectory = project.file('run/stress/server')
            programArgument '--nogui'
            systemProperty 'incoming.stress', System.getenv('INCOMING_STRESS') ?: 'run'
            systemProperty 'incoming.stress.players', System.getenv('INCOMING_STRESS_PLAYERS') ?: '3'
            systemProperty 'incoming.stress.restart', System.getenv('INCOMING_STRESS_RESTART') ?: 'false'
            systemProperty 'incoming.stress.probes', System.getenv('INCOMING_STRESS_PROBES') ?: 'true'
            jvmArgument "-Xlog:gc:file=${project.file('run/stress/server/gc.log').absolutePath}:time,uptime"
            // optional server JFR profile, as for the client scenario: INCOMING_JFR=1 tools/stress.sh →
            // run/stress/server/stress.jfr
            if (System.getenv('INCOMING_JFR')) jvmArgument "-XX:StartFlightRecording=filename=${project.file('run/stress/server/stress.jfr').absolutePath},settings=profile"
            // server and three clients on one machine: without a limit each JVM takes ¼ of memory, and the kernel kills
            // a client. INCOMING_RIG_JVM=artem — server with the JVM as in Artem's game (8 GB, generational ZGC), only
            // where there is enough memory (VPS): 8 GB of server and three 2 GB clients would not fit in the 15 GB
            // cloud. The director writes the collector into the log and does not start if the stand's JVM (the Gradle
            // toolchain) runs with another collector (incoming.stress.gc — the start of the MXBean name: generational
            // ZGC has «ZGC Minor/Major …», non-generational — «ZGC Cycles») or with a heap smaller than ordered
            // (incoming.stress.heap, MB)
            def rigJvm = System.getenv('INCOMING_RIG_JVM') ?: 'default'
            if (rigJvm == 'artem') {
                ['-Xmx8g', '-XX:+UseZGC', '-XX:+ZGenerational'].each { jvmArgument it }
                systemProperty 'incoming.stress.gc', 'ZGC Minor'
                systemProperty 'incoming.stress.heap', '8192'
            } else if (rigJvm == 'default') {
                jvmArgument '-Xmx4g'
            } else {
                throw new GradleException("INCOMING_RIG_JVM=${rigJvm}: expected artem or default")
            }
        }
        stressClient {
            client()
            def name = System.getenv('INCOMING_STRESS_NAME') ?: 'Host'
            gameDirectory = project.file("run/stress/${name}")
            // the stand's server listens only on loopback, its port is free — tools/stress.sh picks it
            def server = "127.0.0.1:${System.getenv('INCOMING_STRESS_PORT') ?: '25565'}"
            programArguments.addAll '--username', name, '--quickPlayMultiplayer', server, '--width', '854', '--height', '480'
            systemProperty 'incoming.stress.server', server
            systemProperty 'incoming.stress.client', System.getenv('INCOMING_STRESS_ROLE') ?: 'friend'
            jvmArgument '-Xmx2g'
        }
        gameTestServer {
            type = 'gameTestServer'
            gameDirectory = project.file('run/gametest')
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
            // own share of batches on the CI machine: -PgametestShard=i/n (devtest GameTestShards); without the
            // property — all tests
            systemProperty 'incoming.gametest.shard', (project.findProperty('gametestShard') ?: '').toString()
            // only batches matching a regular expression: -PgametestOnly='nuke_scorch|nuke_fresh'
            systemProperty 'incoming.gametest.only', (project.findProperty('gametestOnly') ?: '').toString()
        }
        // Flight scenarios (gametest/scenario): all seeds (-PscenarioSeeds, 16 by default) without the other GameTests
        // — the scenario template in its own namespace incoming_sweep. -PscenarioOnly=<regular expression> — only
        // matching scenarios; -PscenarioRealChunks — real chunk loading at game pace, without the reference
        scenarioSweep {
            type = 'gameTestServer'
            gameDirectory = project.file('run/scenario-sweep')
            systemProperty 'neoforge.enabledGameTestNamespaces', 'incoming_sweep'
            systemProperty 'incoming.scenario.sweep', 'true'
            systemProperty 'incoming.scenario.seeds', (project.findProperty('scenarioSeeds') ?: '16').toString()
            systemProperty 'incoming.scenario.only', (project.findProperty('scenarioOnly') ?: '').toString()
            systemProperty 'incoming.scenario.realChunks', project.hasProperty('scenarioRealChunks').toString()
        }
        // Re-record the trajectory baseline (seed 0): src/devtest/resources/scenario-baseline.json
        scenarioRecord {
            type = 'gameTestServer'
            gameDirectory = project.file('run/scenario-record')
            systemProperty 'neoforge.enabledGameTestNamespaces', 'incoming_sweep'
            systemProperty 'incoming.scenario.sweep', 'true'
            systemProperty 'incoming.scenario.record', project.file('src/devtest/resources/scenario-baseline.json').absolutePath
        }
        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.INFO
        }
    }
    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
            sourceSet(sourceSets.devtest)
        }
    }
}
// -Xlog:gc writes to logs/ of the run directory, and the JVM does not create that directory itself nor start without it
// (fresh clone, cloud)
tasks.matching { it.name == 'runClientScenario' }.configureEach { doFirst { project.file("${scenarioDir}/logs").mkdirs() } }
tasks.matching { it.name == 'runStressServer' }.configureEach { doFirst { project.file('run/stress/server').mkdirs() } }
neoForge.addModdingDependenciesTo(sourceSets.devtest)
// unit tests of code that holds data in Minecraft classes (Vec3, NBT), without starting the game
neoForge.addModdingDependenciesTo(sourceSets.test)

dependencies {
    // Sable: only the API for compilation; during the game it is in the pack
    compileOnly "dev.ryanhcode.sable:sable-common-${minecraft_version}:${sable_version}"
    // sable-companion (MIT): soft dependency — without Sable the built-in stub works
    compileOnly "dev.ryanhcode.sable-companion:sable-companion-common-${minecraft_version}:${sable_companion_version}"
    // Distant Horizons: only the API for compilation — far terrain for the aiming map if DH is installed
    // (compat/DistantHorizons)
    compileOnly "maven.modrinth:distanthorizonsapi:${dh_api_version}"
    // LOD Server Support (MIT): only for compilation — far terrain from the server through its client API
    // (client/map/LssTerrain)
    compileOnly "maven.modrinth:lod-server-support:${lss_version}"
    // a range, not an exact version: Sable carries the same companion with its own range, and FML picks one version
    // suitable for all — exactly [1.6.0] would not let in a game with Sable that brings 1.6.1
    jarJar("dev.ryanhcode.sable-companion:sable-companion-common-${minecraft_version}") {
        version { strictly "[${sable_companion_version},2.0)"; prefer sable_companion_version }
    }

    sandboxMods "dev.ryanhcode.sable-companion:sable-companion-common-${minecraft_version}:${sable_companion_version}"

    testImplementation platform('org.junit:junit-bom:5.10.2')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testImplementation 'org.mockito:mockito-core:5.14.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    // SoundAssetsTest reads sounds.json
    testImplementation 'com.google.code.gson:gson:2.10.1'
    // same version as Veil in the Sable pack (Veil 4.3.2): ShaderSourceTest prints the shaders as Veil does
    testImplementation 'io.github.ocelot:glsl-processor:0.2.3'
}

test {
    useJUnitPlatform()
}

// Mod load order for runs from Gradle. simulated, offroad and aeronautics (all of Create Aeronautics) in their own
// constructors add callbacks to Create's registry (CreateRegistrateRegistrationCallback), and their dependency on
// create has ordering "NONE": FML builds them in parallel with Create and with each other, and Registrate's
// HashMultimap of callbacks gets corrupted by simultaneous writes. In dev (not production) Registrate then fails at
// startup with «Found unused register callbacks». Overriding the FML dependencies (dependencyOverrides in
// config/fml.toml, the standard loader setting) places them strictly one after another after Create: no race, and the
// other mods still build in parallel. We do not touch fml.toml in the host's game: there Registrate does not fail
// because of this.
def fmlDependencyOverrides = """# Written by build.gradle before each run (the whole file); FML fills in the other keys itself with default values
[dependencyOverrides]
simulated = ["+create", "+sable"]
offroad = ["+simulated"]
aeronautics = ["+simulated", "+offroad"]
"""
def writeFmlOverrides = { File gameDir ->
    File config = new File(gameDir, 'config/fml.toml')
    // sandbox — mod only: overriding absent FML mods shows a warning screen before the main
    // menu, and the windowless client gets stuck on it
    if (sandbox && gameDir == project.file(scenarioDir)) {
        if (config.isFile() && config.text.startsWith(fmlDependencyOverrides.readLines().first())) config.delete()
        return
    }
    // without Create Aeronautics in the run's pack there is nothing to override
    if (!(mcModsDir.isDirectory() && mcModsDir.list().any { it.contains('aeronautics') })) return
    config.parentFile.mkdirs()
    config.text = fmlDependencyOverrides
}
// before each run from Gradle (client, server, GameTest, scenario, stand): the game directory — of the run task itself
tasks.matching { it.name.startsWith('run') && it.hasProperty('gameDirectory') }.configureEach { task ->
    task.doFirst { writeFmlOverrides(task.gameDirectory.get().asFile) }
}

// Runs without a live Gradle (the stand tools/stress.sh, multiplayer tools/mp_scenario.sh): the Gradle process holds
// a UDP socket for file locks (DefaultFileLockCommunicator) on 0.0.0.0, and its address cannot be set. So the servers
// and clients of the checks go not as a run* task but through a script that this task writes: ./gradlew rigLaunch
// -PrigRun=runStressServer -PrigOut=stress-server → build/rig/stress-server.sh (the same java, arguments, classpath,
// directory and environment as the run task; MDG argument files are copied: the stand's clients share one of them).
// Gradle exits, the game does not.
tasks.register('rigLaunch') {
    def runName = project.findProperty('rigRun')
    def out = project.findProperty('rigOut')
    if (runName) dependsOn { tasks.named(runName as String).get().taskDependencies }
    doFirst {
        // without the script's name the old build/rig/<name>.sh would remain, and the check script would start a stale
        // run
        if (!runName || !out) throw new GradleException('rigLaunch needs -PrigRun and -PrigOut')
    }
    doLast {
        def run = tasks.named(runName as String).get()
        File dir = layout.buildDirectory.dir('rig').get().asFile
        dir.mkdirs()
        // MDG @file — a copy under its own name: the next rigLaunch of the same run (another stand client) will
        // overwrite it
        def own = { String arg ->
            if (!arg.startsWith('@')) return arg
            File src = file(arg.substring(1))
            File copy = new File(dir, "${out}-${src.name}")
            copy.bytes = src.bytes
            return '@' + copy.absolutePath
        }
        // sandbox with JetBrains Runtime (INCOMING_SANDBOX_JAVA — its bin/java): hot swap of both new fields and
        // methods
        String java = sandbox && System.getenv('INCOMING_SANDBOX_JAVA') ? System.getenv('INCOMING_SANDBOX_JAVA')
                : run.javaLauncher.get().executablePath.asFile.absolutePath
        List<String> cmd = [java]
        // allJvmArgs of JavaExec does not carry the task's explicit jvmArgs, and those hold the MDG @file (modules,
        // --add-opens, the run's -D)
        cmd += ((run.jvmArgs ?: []) + run.allJvmArgs.findAll { !(it in (run.jvmArgs ?: [])) }).collect(own)
        cmd += ['-cp', run.classpathProvider.asPath, run.mainClass.get()]
        cmd += (run.args + run.argumentProviders.collectMany { it.asArguments() as List }).collect(own)
        def quote = { String v -> "'" + v.replace("'", "'\\''") + "'" }
        File gameDir = run.gameDirectory.get().asFile
        writeFmlOverrides(gameDir)
        File script = new File(dir, "${out}.sh")
        script.text = "#!/usr/bin/env bash\n# ${runName} without Gradle: written by ./gradlew rigLaunch (build.gradle)\n" +
                "mkdir -p ${quote(gameDir.absolutePath)}/logs && cd ${quote(gameDir.absolutePath)} || exit 1\n" +
                "exec env ${run.environmentProperty.get().collect { k, v -> quote("${k}=${v}") }.join(' ')} ${cmd.collect(quote).join(' ')}\n"
        script.setExecutable(true)
    }
}

// Copies the build's mods into the run directory: FML unpacks the nested jars itself (Flywheel, Ponder, Veil…)
def copyRuntimeMods = { String runDir ->
    tasks.register("copyRuntimeMods_${runDir}", Sync) {
        // sandbox — without Create and Sable (starts in seconds); sable-companion is not embedded in dev — its jar sits
        // next to it
        if (sandbox && runDir == 'scenario') from(configurations.sandboxMods)
        def patterns = runDir == 'scenario' ? (sandbox ? [] : runtimeModPatterns) + shaderModPatterns + dhModPatterns + voxyModPatterns + lssModPatterns
                : runDir in ['gametest', 'scenario-sweep', 'scenario-record'] ? runtimeModPatterns + lithiumModPatterns : runtimeModPatterns
        // without from() patterns it would take the whole mods directory; the patterns are in this from(): in the
        // each-closure an include would go to the task root and would filter out the sandbox jar as well
        if (patterns) from(mcModsDir, { CopySpec spec -> spec.include(patterns) } as Action<CopySpec>)
        into({ "${runDir == 'scenario' ? scenarioDir : project.findProperty(runDir + 'Dir') ?: 'run/' + runDir}/mods" })
        onlyIf { sandbox && runDir == 'scenario' || mcModsDir.isDirectory() }
    }
}
['client', 'server', 'gametest', 'scenario', 'scenario-sweep', 'scenario-record'].each { copyRuntimeMods(it) }
tasks.register('copyRuntimeMods_stress', Sync) {
    from(mcModsDir) { runtimeModPatterns.each { include it } }
    into "run/stress/mods"
    onlyIf { mcModsDir.isDirectory() }
}
tasks.matching { it.name in ['runStressServer', 'runStressClient'] }.configureEach { dependsOn 'copyRuntimeMods_stress' }
tasks.matching { it.name == 'runClient' }.configureEach { dependsOn 'copyRuntimeMods_client' }
tasks.matching { it.name == 'runServer' }.configureEach { dependsOn 'copyRuntimeMods_server' }
tasks.matching { it.name == 'runClientScenario' }.configureEach {
    dependsOn 'copyRuntimeMods_scenario'
    if (sandbox) dependsOn 'sandboxAgentJar'
}
tasks.matching { it.name == 'runGameTestServer' }.configureEach { dependsOn 'copyRuntimeMods_gametest' }
tasks.matching { it.name == 'runScenarioSweep' }.configureEach { dependsOn 'copyRuntimeMods_scenario-sweep' }
tasks.matching { it.name == 'runScenarioRecord' }.configureEach { dependsOn 'copyRuntimeMods_scenario-record' }
// GameTest world — new each time, as in CI: the flight-scenario pads stand at the same coordinates, and the terrain,
// vehicles and chunks of a previous run would change the flight against the baseline
tasks.matching { it.name in ['runGameTestServer', 'runScenarioSweep', 'runScenarioRecord'] }.configureEach { task ->
    doFirst { project.delete(new File(task.gameDirectory.get().asFile, 'world')) }
}

var generateModMetadata = tasks.register('generateModMetadata', ProcessResources) {
    var replaceProperties = [
        minecraft_version: minecraft_version, minecraft_version_range: minecraft_version_range,
        neo_version: neo_version, loader_version_range: loader_version_range,
        mod_id: mod_id, mod_name: mod_name, mod_license: mod_license, mod_version: mod_version,
        mod_authors: mod_authors, mod_description: mod_description, mod_url: mod_url, sable_version: sable_version,
        dh_version_range: dh_version_range,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from 'src/main/templates'
    into 'build/generated/sources/modMetadata'
}
sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

// GPL: a copy of the license — in each jar that goes to players
tasks.named('jar', Jar) {
    from(file('../LICENSE'))
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.compilerArgs += ['-Xlint:all,-processing,-serial,-classfile,-this-escape', '-Xmaxerrs', '1000']
}

// Enforce the enabled lint categories in shipped code and development checks.
['compileJava', 'compileDevtestJava'].each { name ->
    tasks.named(name, JavaCompile) {
        options.compilerArgs += ['-Werror']
    }
}

// Hot-swap agent of the effects sandbox (src/sandboxAgent, tools/sandbox.sh): -javaagent of the sandbox client
tasks.register('sandboxAgentJar', Jar) {
    archiveBaseName = 'sandbox-agent'
    archiveVersion = ''
    destinationDirectory = layout.buildDirectory.dir('sandbox')
    from(sourceSets.sandboxAgent.output)
    manifest.attributes('Premain-Class': 'ua.zentix.hotswap.HotswapAgent', 'Can-Redefine-Classes': 'true')
}

// Test build for the production client (tools/prod_client.py): the mod together with the scenarios from devtest.
// A separate directory, so that deploy.sh and the release never take it instead of the regular jar.
tasks.register('scenarioJar', Jar) {
    dependsOn tasks.named('jar')
    archiveClassifier = 'scenario'
    destinationDirectory = layout.buildDirectory.dir('scenario-libs')
    from(zipTree(tasks.named('jar').flatMap { it.archiveFile }))
    from(sourceSets.devtest.output)
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}
