# Сборка, юнит-тесты и GameTest (сервер с Create, Sable, Aeronautics с Modrinth); jar — в артефактах запуска.
# Проверяется то, что изменилось: правка только инструментов (tools/, кроме модов для GameTest) и текстов (docs/, *.md)
# мод не собирает и GameTest не гоняет (разбор повторов tools/replayscan и стенд сцен tools/stand — своя сборка и
# юнит-тесты); правка мода,
# модов GameTest или самого CI — проверка целиком. GameTest идёт
# частями на шести машинах сразу (devtest GameTestShards), сборка и юнит-тесты — рядом. Итог всех проверок — «Итог».
# Сборка «Open Skies» и мост ведущего Almighty — в своих репозиториях (zentixua/open-skies, zentixua/almighty).
# Ручной запуск на main (или на ветке claude/release-*, чтобы выпустить ровно проверенный коммит) с release=true:
# проверка целиком, после неё — релиз v<mod_version> на GitHub с этим jar и заметками из docs/releases/<mod_version>.md.
name: build

# Каждый коммит проверяется один раз: ветки — запуском pull_request (он и решает слияние), main — push.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      release:
        description: Выпустить релиз v<mod_version> (только с main или claude/release-*)
        type: boolean
        default: false
      # повтор нестабильного теста на GitHub, а не на ноутбуке: каждая из шести машин гоняет подходящие партии
      # gametest_repeat раз, каждый раз в новом мире (tools/ci_repeat.sh запускает и сводит итог)
      gametest_only:
        description: Только партии GameTest, чьё имя целиком подходит под регулярное выражение (повтор флака), пусто — все
        type: string
        default: ''
      gametest_repeat:
        description: Сколько раз прогнать эти партии на каждой из шести машин
        type: number
        default: 1

# пуш отменяет прежнюю сборку той же ветки; ручной запуск (релиз) — в своей группе, пуш в main его не отменит
concurrency:
  group: ${{ github.event_name == 'workflow_dispatch' && format('release-{0}', github.run_id) || format('build-{0}', github.ref) }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Что изменил коммит: PR — против базы (у слияния PR, которое проверяет CI, первый родитель — база), push в main —
  # против прежнего main. Ручной запуск и неизвестная база — проверка целиком; незнакомый путь — тоже.
  changes:
    name: Что изменилось
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      mod: ${{ steps.diff.outputs.mod }}
      rig: ${{ steps.diff.outputs.rig }}
      replayscan: ${{ steps.diff.outputs.replayscan }}
      lookgate: ${{ steps.diff.outputs.lookgate }}
      stand: ${{ steps.diff.outputs.stand }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 2
      - name: Что изменилось
        id: diff
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          case "$GITHUB_EVENT_NAME" in
            pull_request) base=HEAD^1 ;;
            push) base=$BEFORE; git fetch --no-tags --depth=1 origin "$base" || base= ;;
            *) base= ;;
          esac
          if [ -z "$base" ]; then
            mod=true; rig=true; replayscan=true; lookgate=true; stand=true
            echo "Проверка целиком ($GITHUB_EVENT_NAME)" >> "$GITHUB_STEP_SUMMARY"
          else
            mod=false; rig=false; replayscan=false; lookgate=false; stand=false
            # --no-renames: перенос из mod/ — это и удаление в mod/
            files=$(git diff --name-only --no-renames "$base" HEAD)
            while IFS= read -r f; do
              case "$f" in
                '') ;;
                mod/gradlew|mod/gradle/*) mod=true; replayscan=true; stand=true ;;
                # строки лога пробы читает tools/look_gate/check.py
                mod/src/devtest/java/ua/zentix/incoming/scenario/ProbeScenario.java) mod=true; lookgate=true ;;
                mod/*|tools/fetch_runtime_mods.py|tools/paths.py) mod=true ;;
                tools/rig_procs.sh|tools/test_rig_procs.sh|tools/gpu_lease.sh|tools/test_gpu_lease.sh|tools/laptop_job.sh|tools/sandbox.sh|tools/test_sandbox.sh|tools/nested_kwin.sh|tools/stress.sh|tools/mp_scenario.sh) rig=true ;;
                tools/replayscan/*) replayscan=true ;;
                tools/look_gate/*) lookgate=true ;;
                tools/stand/*) stand=true ;;
                .github/*) mod=true; rig=true; replayscan=true; lookgate=true; stand=true ;;
                tools/*|docs/*|*.md|.claude/*|.gitignore) ;;
                *) mod=true ;;
              esac
            done <<< "$files"
            { echo "Мод (сборка, юнит-тесты, GameTest): $mod; остановка проверок: $rig; разбор повторов: $replayscan; шлагбаум: $lookgate; стенд: $stand"; echo; echo '```'; echo "$files"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "mod=$mod" >> "$GITHUB_OUTPUT"
          echo "rig=$rig" >> "$GITHUB_OUTPUT"
          echo "replayscan=$replayscan" >> "$GITHUB_OUTPUT"
          echo "lookgate=$lookgate" >> "$GITHUB_OUTPUT"
          echo "stand=$stand" >> "$GITHUB_OUTPUT"

  build:
    name: Сборка и юнит-тесты
    needs: changes
    if: needs.changes.outputs.mod == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: mod
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      # кэш Gradle на main пишет только эта задача (части GameTest его читают): шесть копий по ~1,3 ГБ вытесняли бы
      # друг друга из кэша репозитория
      - uses: gradle/actions/setup-gradle@v5

      # запуск GameTest (classpath сервера, ассеты) готовится и здесь: что задача не тронула, setup-gradle из кэша убирает
      - name: Сборка и юнит-тесты
        run: ./gradlew build prepareGameTestServerRun --console=plain

      - uses: actions/upload-artifact@v6
        with:
          name: incoming-jar
          path: mod/build/libs/*.jar
          if-no-files-found: error

      - name: Отчёты при падении
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: reports
          path: mod/build/reports/
          if-no-files-found: ignore

  gametest:
    name: GameTest ${{ matrix.part }}/${{ strategy.job-total }}
    needs: changes
    if: needs.changes.outputs.mod == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.gametest_only != '' && 120 || 25 }}
    strategy:
      # упавшая часть не обрывает остальные: все падения — за один прогон
      fail-fast: false
      matrix:
        part: [1, 2, 3, 4, 5, 6]
    defaults:
      run:
        working-directory: mod
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v5
        with:
          cache-read-only: true

      - name: Моды для GameTest
        uses: actions/cache@v5
        with:
          path: mod/run/ci-mods
          key: runtime-mods-${{ hashFiles('tools/fetch_runtime_mods.py') }}
      - run: python3 ../tools/fetch_runtime_mods.py run/ci-mods

      - name: GameTest
        env:
          ONLY: ${{ inputs.gametest_only }}
          REPEAT: ${{ inputs.gametest_repeat || 1 }}
          SHARD: ${{ matrix.part }}/${{ strategy.job-total }}
        run: |
          if [ -z "$ONLY" ]; then
            ./gradlew runGameTestServer -PmcModsDir=run/ci-mods -PgametestShard=$SHARD --console=plain
            grep -E 'All [0-9]+ required tests passed' run/gametest/logs/latest.log
            exit
          fi
          # повтор: все подходящие партии на этой машине, REPEAT раз, каждый в новом мире; падение не обрывает повторы;
          # выражение, под которое не подошла ни одна партия, — тоже падение («All 0 required tests passed» не считается)
          passed=0
          for i in $(seq "$REPEAT"); do
            if ./gradlew runGameTestServer -PmcModsDir=run/ci-mods "-PgametestOnly=$ONLY" --console=plain --quiet \
                && grep -qE 'All [1-9][0-9]* required tests passed' run/gametest/logs/latest.log; then
              passed=$((passed + 1))
            else
              cp run/gametest/logs/latest.log "run/gametest/logs/failed-$i.log" 2>/dev/null || true
              grep -E 'failed|::' run/gametest/logs/latest.log | grep -iE 'fail|exception' | head -5
            fi
          done
          echo "GameTest repeat: «$ONLY» passed $passed of $REPEAT (part $SHARD)" | tee -a "$GITHUB_STEP_SUMMARY"
          [ "$passed" = "$REPEAT" ]

      - name: Логи при падении
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: logs-gametest-${{ matrix.part }}
          path: mod/run/gametest/logs/
          if-no-files-found: ignore

  # процессы стенда и мультиплеера гасятся целиком, без сирот (tools/rig_procs.sh), ~4 с; видеокарта — у одной сессии,
  # ждущие — по очереди (tools/gpu_lease.sh); песочница — время до эффекта, моды режима (tools/test_sandbox.sh); без Java
  # и модов
  rig:
    name: Остановка проверок
    needs: changes
    if: needs.changes.outputs.rig == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - name: Остановка проверок
        timeout-minutes: 2
        run: tools/test_rig_procs.sh
      - name: Аренда видеокарты
        timeout-minutes: 2
        run: tools/test_gpu_lease.sh
      - name: Песочница без клиента
        timeout-minutes: 1
        run: tools/test_sandbox.sh

  # разбор повторов Flashback (tools/replayscan): сборка мода разбора и юнит-тесты, без игры
  replayscan:
    name: Разбор повторов
    needs: changes
    if: needs.changes.outputs.replayscan == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      # кэш Gradle пишет только сборка мода (те же NeoForge и Minecraft)
      - uses: gradle/actions/setup-gradle@v5
        with:
          cache-read-only: true
      - name: Сборка и юнит-тесты
        run: mod/gradlew -p tools/replayscan build --console=plain

  # прогон шлагбаума картинки и звука годен, только если слух без оглушения и сцены — во времени игры эталона
  # (tools/look_gate/check.py, по логу клиента); без Java и игры, секунды
  lookgate:
    name: Шлагбаум
    needs: changes
    if: needs.changes.outputs.lookgate == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - name: Годность прогона шлагбаума
        run: python3 -m unittest discover -s tools/look_gate -p 'test_*.py' -v

  # стенд сцен (tools/stand): сборка мода-обвязки и её юнит-тесты, разбор, план и шлагбаум (test_gate.py) — без игры;
  # сам стенд снимается на ноутбуке (stand.py pr), его вердикт — статус коммита «Стенд сцен», не эта задача
  stand:
    name: "Стенд: сборка и шлагбаум"
    needs: changes
    if: needs.changes.outputs.stand == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      # кэш Gradle пишет только сборка мода (те же NeoForge и Minecraft)
      - uses: gradle/actions/setup-gradle@v5
        with:
          cache-read-only: true
      - name: Сборка обвязки и её юнит-тесты
        run: mod/gradlew -p tools/stand build --console=plain
      - name: Разбор, план и шлагбаум
        run: python3 -m unittest discover -s tools/stand -p 'test_*.py' -v

  # одна отметка на коммит: всё, что изменение требовало, прошло; ненужное пропущено
  ci:
    name: Итог
    needs: [changes, build, gametest, rig, replayscan, lookgate, stand]
    # и после упавших, пропущенных и отменённых: пропущенная задача засчитывается успехом, и «Итог», пропущенный
    # в отменённом прогоне, был бы зелёным без сборки и GameTest — поэтому в отменённом прогоне он идёт и падает
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Нужные проверки прошли
        run: |
          echo 'что изменилось: ${{ needs.changes.result }}; сборка: ${{ needs.build.result }}; GameTest: ${{ needs.gametest.result }}; остановка проверок: ${{ needs.rig.result }}; разбор повторов: ${{ needs.replayscan.result }}; шлагбаум: ${{ needs.lookgate.result }}; стенд: ${{ needs.stand.result }}'
          [ '${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}' = false ]

  release:
    name: Релиз
    needs: [build, gametest, rig]
    if: github.event_name == 'workflow_dispatch' && inputs.release && inputs.gametest_only == '' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/claude/release-'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v7
        with:
          name: incoming-jar
          path: mod/build/libs
      - name: Релиз
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v=$(sed -n 's/^mod_version=//p' mod/gradle.properties)
          gh release create "v$v" "mod/build/libs/incoming-$v.jar" --target "$GITHUB_SHA" \
            --title "Incoming $v" --notes-file "docs/releases/$v.md"
