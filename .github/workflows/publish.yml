# Manual store publishing: draft creates/updates the private Modrinth page; submit requests review;
# release uploads a version. Pages/media use the workflow revision only when explicitly requested
# (always for draft). The jar, changelog and environment come from the selected GitHub release tag;
# The jar must also match the artifact of a successful release build for that exact tag commit.
# No CURSEFORGE_ID disables CurseForge with a warning. A set ID requires both the upload token and
# the separate CURSEFORGE_API_KEY used to check existing files before upload. Required page media
# must all exist before any remote mutation. No release or publishing runs automatically.
name: publish
run-name: publish ${{ inputs.step }} ${{ inputs.version || '(latest release)' }}

on:
  workflow_dispatch:
    inputs:
      step:
        description: "draft — Modrinth draft; submit — review (and CurseForge); release — new version"
        type: choice
        options: [draft, submit, release]
        default: draft
      version:
        description: GitHub release without “v” (3.0.0); empty — latest
        type: string
        required: false
      update_page:
        description: Update the Modrinth page and media from this workflow revision (draft always does)
        type: boolean
        default: false

# Concurrent runs must not create the project twice.
concurrency:
  group: publish
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    name: ${{ inputs.step }}
    environment: store-publish
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
      deployments: write
    env:
      HAS_MODRINTH: ${{ secrets.MODRINTH_TOKEN != '' }}
      HAS_CURSEFORGE: ${{ secrets.CURSEFORGE_TOKEN != '' && vars.CURSEFORGE_ID != '' }}
      # Optional; slug as on CurseForge (Create Aeronautics is only on Modrinth).
      DEPENDENCIES: |
        create(optional){modrinth:create}{curseforge:create}
        create-aeronautics(optional){modrinth:create-aeronautics}#(ignore:curseforge)
        sable(optional){modrinth:sable}{curseforge:sable}
        distanthorizons(optional){modrinth:distanthorizons}{curseforge:distant-horizons}
        voxy(optional){modrinth:voxy}#(ignore:curseforge)
        roxy(optional){modrinth:roxy}{curseforge:roxy}
        lss(optional){modrinth:lod-server-support}#(ignore:curseforge)
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Validate store configuration
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
          CURSEFORGE_TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}
          CURSEFORGE_ID: ${{ vars.CURSEFORGE_ID }}
          CURSEFORGE_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}
          STEP: ${{ inputs.step }}
        run: python3 tools/release_checks.py stores "$STEP"
      - name: Validate store drafts
        run: python3 -m unittest discover -s .github/scripts -p 'test_store*.py' -v

      - name: Release
        id: rel
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ inputs.version }}
        run: |
          python3 tools/prepare_publish.py

      - name: "Modrinth: page"
        id: page
        if: env.HAS_MODRINTH == 'true' && (inputs.step == 'draft' || (inputs.step == 'release' && inputs.update_page))
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
          STEP: ${{ inputs.step }}
          JAR: ${{ steps.rel.outputs.jar }}
        run: bash .github/scripts/modrinth.sh page "$STEP" "$JAR"

      - name: "Modrinth: check release jar without changing the page"
        id: version
        if: env.HAS_MODRINTH == 'true' && inputs.step == 'release' && !inputs.update_page
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
          JAR: ${{ steps.rel.outputs.jar }}
        run: bash .github/scripts/modrinth.sh version "$JAR"

      # Kira-NT/mc-publish v3.3.1 pinned by commit: receives tokens; stores without tokens skipped.
      - name: "Modrinth: version"
        if: steps.page.outputs.upload == 'true' || steps.version.outputs.upload == 'true'
        uses: Kira-NT/mc-publish@52307b03863581dec6b652b83e597aec02ebb075 # v3.3.1
        with:
          modrinth-id: ${{ steps.page.outputs.id || steps.version.outputs.id }}
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          files: ${{ steps.rel.outputs.jar }}
          name: Incoming ${{ steps.rel.outputs.version }}
          version: ${{ steps.rel.outputs.version }}
          version-type: release
          changelog-file: dist/changelog.md
          loaders: neoforge
          game-versions: 1.21.1
          java: 21
          environment: ${{ steps.rel.outputs.environment }}
          dependencies: ${{ env.DEPENDENCIES }}

      - name: "Modrinth: submit for review"
        if: env.HAS_MODRINTH == 'true' && inputs.step == 'submit'
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
        run: bash .github/scripts/modrinth.sh submit

      # Check and publish each store independently, including after a failure on the other store.
      - name: "CurseForge: check for an existing jar"
        id: curseforge
        if: ${{ !cancelled() && steps.rel.outcome == 'success' && env.HAS_CURSEFORGE == 'true' && inputs.step != 'draft' }}
        env:
          CURSEFORGE_ID: ${{ vars.CURSEFORGE_ID }}
          CURSEFORGE_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}
          JAR: ${{ steps.rel.outputs.jar }}
          VERSION: ${{ steps.rel.outputs.version }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: python3 .github/scripts/curseforge_check.py "$JAR"

      - name: CurseForge
        id: curseforge_upload
        if: ${{ !cancelled() && steps.curseforge.outputs.upload == 'true' }}
        uses: Kira-NT/mc-publish@52307b03863581dec6b652b83e597aec02ebb075 # v3.3.1
        with:
          curseforge-id: ${{ vars.CURSEFORGE_ID }}
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}
          retry-attempts: 1
          files: ${{ steps.rel.outputs.jar }}
          name: Incoming ${{ steps.rel.outputs.version }}
          version: ${{ steps.rel.outputs.version }}
          version-type: release
          changelog-file: dist/changelog.md
          loaders: neoforge
          game-versions: 1.21.1
          java: 21
          environment: ${{ steps.rel.outputs.environment }}
          dependencies: ${{ env.DEPENDENCIES }}

      - name: "CurseForge: record the upload outcome"
        if: ${{ always() && steps.curseforge.outputs.deployment_id != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          DEPLOYMENT_ID: ${{ steps.curseforge.outputs.deployment_id }}
          OUTCOME: ${{ steps.curseforge_upload.outcome }}
        run: python3 .github/scripts/curseforge_check.py --record "$DEPLOYMENT_ID" "$OUTCOME"
