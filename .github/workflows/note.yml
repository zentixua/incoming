# «Записка»: PR, который меняет то, что игрок видит или слышит, несёт в описании раздел `## Записка` — закон, где он
# верен, что видно и слышно в ключевые моменты (шаблон — .github/PULL_REQUEST_TEMPLATE.md). Пути и разбор описания —
# tools/pr_note.py (юнит-тест рядом). Отдельно от build.yml: правка описания перезапускает только эту проверку.
# Зелёная «Записка» — условие влития, как «Итог».
name: note

on:
  pull_request:
    types: [opened, edited, synchronize, reopened, ready_for_review]

concurrency:
  group: note-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  note:
    name: Записка
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # голова PR, а не слияние с базой: при конфликте слияния его нет, а проверке нужен только скрипт
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Юнит-тест проверки
        run: python3 -m unittest discover -s tools -p 'test_pr_note.py'
      # файлы PR — из API (при переносе — и старый путь): описание правят без нового коммита
      - name: Записка
        env:
          GH_TOKEN: ${{ github.token }}
          PR_BODY: ${{ github.event.pull_request.body }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR/files" --jq '.[] | .filename, (.previous_filename // empty)' > files.txt
          python3 tools/pr_note.py < files.txt
